<body>
  <script>
    // Immediately set theme before React loads to prevent blank screen on mobile Safari
    // CSS variables are only defined under [data-theme] selectors, so this must run ASAP
    (function() {
      try {
        var stored = localStorage.getItem('athos-ui-storage');
        var theme = 'light';
        if (stored) {
          var parsed = JSON.parse(stored);
          theme = (parsed && parsed.state && parsed.state.theme) || 'system';
        }
        if (theme === 'system') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', theme);
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        }
      } catch(e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
