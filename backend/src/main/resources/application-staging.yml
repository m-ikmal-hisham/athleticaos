spring:
  config:
    activate:
      on-profile: staging
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:athleticaos_staging}
    username: ${DB_USER:staging_user}
    password: ${DB_PASSWORD:staging_pass}
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
