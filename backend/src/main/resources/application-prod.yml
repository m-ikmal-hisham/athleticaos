spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    root: WARN
    com.athleticaos: INFO
    org.hibernate.SQL: WARN

application:
  security:
    cors:
      # Admin app and public site by default. CORS_ALLOWED_ORIGINS replaces the whole list when more
      # origins are needed (e.g. the bare domain once DNS moves): comma-separated, no spaces.
      allowed-origins: ${CORS_ALLOWED_ORIGINS:${FRONTEND_URL},${PUBLIC_URL}}
    jwt:
      secret-key: ${JWT_SECRET}
      expiration: ${JWT_EXPIRATION:86400000}
      refresh-token:
        expiration: 604800000
    cookie:
      secure: true
      same-site: Lax

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
