spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/athleticaos
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    out-of-order: true

logging:
  level:
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

athleticaos:
  security:
    identification-hmac-secret: "ZGV2LWxvY2FsLW9ubHktaWRlbnRpZmljYXRpb24ta2V5LTMyYiE="
