spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/athleticaos
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    out-of-order: true

logging:
  level:
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    # Phase 2.1: BasicBinder TRACE removed to prevent identification parameters
    # from appearing in Hibernate bind-parameter log output.
    # org.hibernate.type.descriptor.sql.BasicBinder: TRACE

athleticaos:
  security:
    # Phase 2.1: dev HMAC secret removed from committed config.
    # Set via environment variable:
    #   export ATHLETICAOS_IDENTIFICATION_HMAC_SECRET="<your-base64-key>"
    # Generate a dev-only key:
    #   openssl rand -base64 32
    identification-hmac-secret: ${ATHLETICAOS_IDENTIFICATION_HMAC_SECRET:}
