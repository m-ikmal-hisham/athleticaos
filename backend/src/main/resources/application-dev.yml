spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/athleticaos
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    out-of-order: true
  mail:
    host: localhost
    port: 1025

app:
  contact:
    mail-enabled: true
    recipient: contact-inbox@athleticaos.local

logging:
  level:
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
