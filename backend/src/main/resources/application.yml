spring:
  application:
    name: athleticaos-backend

  profiles:
    active: dev

  datasource:
    hikari:
      data-source-properties:
        logServerErrorDetail: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        # Load lazy associations (e.g. Player.person) 100 at a time instead of one query per row
        default_batch_fetch_size: 100

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

  mail:
    properties:
      mail:
        smtp:
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

management:
  health:
    mail:
      enabled: false

app:
  contact:
    mail-enabled: ${CONTACT_MAIL_ENABLED:false}
    recipient: ${CONTACT_RECIPIENT:}
    from: ${CONTACT_FROM:no-reply@athleticaos.com}


server:
  port: 8080
  forward-headers-strategy: framework

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui/index.html

application:
  security:
    cors:
      allowed-origins: http://localhost:5173,http://localhost:3000
    jwt:
      secret-key: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      expiration: 86400000
      refresh-token:
        expiration: 604800000

athleticaos:
  backfill:
    # One-off placeholder email backfill (CR-4). Never enable it for the long-running app:
    # pass the switches on the command line of a temporary container instead.
    placeholder-email:
      enabled: ${ATHLETICAOS_BACKFILL_PLACEHOLDER_EMAIL_ENABLED:false}
      dry-run: ${ATHLETICAOS_BACKFILL_PLACEHOLDER_EMAIL_DRY_RUN:true}
      batch-size: ${ATHLETICAOS_BACKFILL_PLACEHOLDER_EMAIL_BATCH_SIZE:200}
