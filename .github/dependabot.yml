version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Asia/Kuala_Lumpur"
    target-branch: "dev"
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Major upgrades are planned work (platform sprint: React 19, Router 7, Vite, Tailwind 4,
      # ESLint 9, TypeScript, zod, zustand...), not weekly bumps. Alerts still show in Security.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # 0.x packages: a "minor" can break. three moves with the platform sprint (F3);
      # eslint-plugin-react-refresh 0.5 needs ESLint 9 (F1).
      - dependency-name: "three"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "@types/three"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "eslint-plugin-react-refresh"
        update-types: ["version-update:semver-minor"]

  - package-ecosystem: "maven"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Asia/Kuala_Lumpur"
    target-branch: "dev"
    open-pull-requests-limit: 5
    groups:
      maven-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Majors are planned work (platform sprint P1–P3)
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.springframework.boot:*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      # springdoc 2.x minors follow Spring Boot minors (2.3–2.5 = Boot 3.2); moves with P1
      - dependency-name: "org.springdoc:*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      # jjwt 0.12 changes the API; separate planned task
      - dependency-name: "io.jsonwebtoken:*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Asia/Kuala_Lumpur"
    target-branch: "dev"
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Major action versions (checkout, setup-node, setup-java...) move with the platform sprint
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
