name: Deploy Frontend to Staging

# Staging frontend deploy pipeline:
# 1. Runs frontend lint deploy gate.
# 2. Builds Vite frontend for staging (--mode staging) and verifies noindex tag.
# 3. Authenticates with AWS via OIDC assuming role athleticaos-gha-staging.
# 4. Syncs hashed assets to S3 (cache-control: 1 year) and root files (no-cache, --delete).
# 5. Invalidates CloudFront distribution cache.

on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: deploy-frontend-staging-${{ github.ref }}
  cancel-in-progress: true

# Frontend lint gate runs in CI via lint:ci ratchet (capped at existing warnings) to prevent new issues.

jobs:
  lint:
    name: Frontend Lint (deploy gate)
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend lint gate
        working-directory: frontend
        run: npm run lint:ci

  deploy:
    name: Deploy Frontend
    needs: [lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Variables come from the "staging" environment (deploys only from the staging branch)
    environment: staging
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build for staging
        working-directory: frontend
        run: npm run build -- --mode staging

      - name: Check the staging build is hidden from search engines
        working-directory: frontend
        run: |
          grep -q '<meta name="robots" content="noindex, nofollow"' dist/index.html || {
            echo "Staging index.html is missing the noindex robots tag. Stopping." >&2
            exit 1
          }

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-staging-frontend-${{ github.run_id }}

      - name: Deploy to S3
        # Hashed files under assets/ never change, so browsers may keep them for a year.
        # Old ones are kept (no --delete) so a tab opened before the deploy can still load its chunks.
        # index.html and the other root files are always revalidated so a new deploy shows up at once.
        env:
          STAGING_S3_BUCKET: ${{ vars.STAGING_S3_BUCKET }}
        run: |
          aws s3 sync frontend/dist/assets s3://"$STAGING_S3_BUCKET"/assets \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 sync frontend/dist/ s3://"$STAGING_S3_BUCKET" \
            --exclude "assets/*" --delete --cache-control "no-cache"

      - name: Invalidate CloudFront cache
        env:
          STAGING_CF_DISTRIBUTION_ID: ${{ vars.STAGING_CF_DISTRIBUTION_ID }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$STAGING_CF_DISTRIBUTION_ID" \
            --paths "/*"
          echo "CloudFront invalidation created! Changes will be visible within 1-2 minutes."
