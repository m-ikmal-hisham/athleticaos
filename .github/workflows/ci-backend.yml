name: Backend CI

on:
  push:
    branches-ignore:
      - staging
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'
  # Every PR into staging runs these checks (no path filter), so they can be required by branch protection.
  pull_request:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

# Frontend lint and build run in ci-frontend.yml (PRs) and gate the frontend staging deploy.

jobs:
  test:
    name: Backend Unit Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Backend Unit Tests
        working-directory: backend
        run: ./mvnw test -B

  integration-test:
    name: Backend Integration Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Backend Integration Tests
        working-directory: backend
        run: ./mvnw test -B -Pintegration
