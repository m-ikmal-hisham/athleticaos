

services:
  postgres:
    image: docker.io/library/postgres:15-alpine
    container_name: athleticaos-postgres
    environment:
      POSTGRES_DB: athleticaos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Local development only. Catches all email sent by the backend (dev profile); web inbox at http://localhost:8025. Staging and production do not use this file.
  mailpit:
    image: docker.io/axllent/mailpit:latest
    container_name: athleticaos-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
